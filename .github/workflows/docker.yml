# Lance les tests, puis construit l'image et la publie sur ghcr.io, à chaque push sur main (Watchtower la met à jour sur le NAS)
name: Image Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Audit du 17/11/2026 : rien n'est publié si les tests échouent
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Étiquettes : latest, la version de l'appli (app/__init__.py) et le commit, pour pouvoir
      # revenir à une image précédente dans Portainer (ghcr.io/…/carnet:1.3.0 ou :sha-abc1234)
      - name: Étiquettes de l'image
        id: etiquettes
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          depot=ghcr.io/${{ github.repository_owner }}/carnet
          echo "tags=$depot:latest,$depot:$version,$depot:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # R11 (audit du 17/11/2026) : étiquette Git de la version publiée, pour retrouver le code de chaque image
      - name: Étiquette Git de version
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/__init__.py)
          if [ -n "$version" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            git tag "v$version" "$GITHUB_SHA"
            git push origin "v$version"
          fi
