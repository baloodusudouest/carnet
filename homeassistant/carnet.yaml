# Paquet Home Assistant de carnet.
# À placer dans /config/packages/carnet.yaml (les packages sont déjà activés pour le kit d'urgence).
# Dans secrets.yaml :
#   carnet_status_url: "http://<IP_DU_NAS>:8096/status"
# /status ne renvoie que des compteurs, aucune donnée personnelle : pas de jeton nécessaire.

rest:
  - resource: !secret carnet_status_url
    scan_interval: 900
    timeout: 10
    sensor:
      - name: Carnet contacts à vérifier
        unique_id: carnet_contacts_a_verifier
        icon: mdi:account-question
        unit_of_measurement: contacts
        state_class: measurement
        value_template: "{{ value_json.a_reviser }}"
        json_attributes:
          - total
          - verifies
          - doublons_a_reviser
          - a_revoir
          - linkedin_sans_contact
      - name: Carnet archives bientôt supprimées
        unique_id: carnet_archives_bientot
        icon: mdi:archive-clock
        value_template: "{{ value_json.archives_bientot }}"
        json_attributes:
          - contacts_archives_bientot
          - prochaine_suppression
      - name: Carnet veille iCloud
        unique_id: carnet_veille_icloud
        icon: mdi:cellphone-sound
        # Nombre de contacts modifiés sur l'iPhone lors de la dernière veille (3 h)
        value_template: "{{ value_json.veille.modifies if value_json.veille else 'unknown' }}"
        json_attributes_path: "$.veille"
        json_attributes:
          - le
          - ok
          - erreur
          - revision
          - nouveaux
          - supprimes

template:
  - binary_sensor:
      - name: Carnet veille en échec
        unique_id: carnet_veille_en_echec
        device_class: problem
        # Problème si la dernière veille a échoué, ou si aucune veille depuis plus de 36 h
        state: >-
          {% set le = state_attr('sensor.carnet_veille_icloud', 'le') %}
          {{ state_attr('sensor.carnet_veille_icloud', 'ok') == false
             or le is none
             or (now() - as_datetime(le)).total_seconds() > 36 * 3600 }}
        attributes:
          erreur: "{{ state_attr('sensor.carnet_veille_icloud', 'erreur') }}"

automation:
  - id: carnet_veille_en_echec
    alias: "Carnet – veille iCloud en échec"
    triggers:
      - trigger: state
        entity_id: binary_sensor.carnet_veille_en_echec
        to: "on"
        for: "00:30:00"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: carnet_veille
          title: "Carnet : veille iCloud en échec"
          message: >-
            {{ state_attr('binary_sensor.carnet_veille_en_echec', 'erreur')
               or "Aucune veille depuis plus de 36 h : carnet est-il démarré ?" }}
            Vérifie le mot de passe d'application iCloud (variables de la stack) puis lance
            « Vérifier maintenant » dans l'onglet iCloud de carnet.

  - id: carnet_archives_bientot
    alias: "Carnet – archives bientôt supprimées"
    triggers:
      - trigger: state
        entity_id: sensor.carnet_archives_bientot_supprimees
    conditions:
      - condition: template
        # Uniquement quand le nombre augmente (pas au redémarrage de HA)
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | int(0) > trigger.from_state.state | int(0) }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: carnet_archives
          title: "Carnet : archives bientôt supprimées"
          message: >-
            {{ trigger.to_state.state }} export(s), soit
            {{ state_attr(trigger.entity_id, 'contacts_archives_bientot') }} fiches, seront
            supprimés à partir du
            {{ as_timestamp(state_attr(trigger.entity_id, 'prochaine_suppression')) | timestamp_custom('%d/%m/%Y') }}.
            Détail dans l'onglet Archives de carnet ; copie le fichier ailleurs pour le garder.
