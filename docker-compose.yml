# Service carnet à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example) :
# CARNET_TELEGRAM_API_ID et CARNET_TELEGRAM_API_HASH sont facultatives ; CARNET_DB_KEY n'est plus lue depuis la 2.6.5.
services:
  carnet:
    image: ghcr.io/baloodusudouest/carnet:${CARNET_VERSION:-latest}
    container_name: carnet
    restart: unless-stopped
    labels:
      # carnet écrit dans iCloud : pas de mise à jour automatique par Watchtower
      - com.centurylinklabs.watchtower.enable=false
    # Fichiers temporaires en mémoire : rien de passager (import, Telegram) n'atteint le disque
    tmpfs:
      - /tmp:size=64m
    ports:
      - "${PORT_CARNET:-8096}:8096"                # réseau local et Tailscale uniquement
    environment:
      - TZ=Europe/Paris
      # Variables communes de la maison (module app/maison.py) ; 2.26 : plus d'anciens jetons par paire (voir REPRISE.md)
      - MAISON_PASSWORD=${MAISON_PASSWORD}         # mot de passe commun des applis (12 caractères au moins)
      - MAISON_JETON=${MAISON_JETON:-}             # jeton commun : Sillage, Gazette, Douze points, Millésime, kit, sauvegardes de l'Anneau
      - MAISON_LECTURE_SEULE=${MAISON_LECTURE_SEULE:-}   # « oui » : aucune appli n'écrit ; CARNET_LECTURE_SEULE l'emporte si posée
      - CARNET_LECTURE_SEULE=${CARNET_LECTURE_SEULE:-}   # « oui » ou « non » : force carnet seul
      # 2.26 : heure de la nuit, émojis → groupes, carnet d'adresses Synology et vérification de son certificat
      # se règlent dans Réglages (fichier /state/reglages.json). Leurs anciennes variables (CARNET_VEILLE_HEURE,
      # CARNET_EMOJI_GROUPES, CARNET_SYNOLOGY_CARNET, CARNET_SYNOLOGY_VERIFIER_TLS) ne sont reprises qu'une fois,
      # au premier démarrage de la 2.26, si elles sont encore dans la stack ; ensuite elles ne sont plus lues.
      - CARNET_ICLOUD_USER=${CARNET_ICLOUD_USER:-}
      - CARNET_ICLOUD_PASSWORD=${CARNET_ICLOUD_PASSWORD:-}  # mot de passe d'application Apple
      - CARNET_SYNOLOGY_URL=${CARNET_SYNOLOGY_URL:-}
      - CARNET_SYNOLOGY_PASSWORD=${CARNET_SYNOLOGY_PASSWORD:-}
      - CARNET_IMMICH_CLE=${CARNET_IMMICH_CLE:-}
      - CARNET_TREEMICH_EMAIL=${CARNET_TREEMICH_EMAIL:-}
      - CARNET_TREEMICH_PASSWORD=${CARNET_TREEMICH_PASSWORD:-}
      - CARNET_HA_TOKEN=${CARNET_HA_TOKEN:-}       # jeton de Home Assistant (/ha/…), inchangé
      - CARNET_MILLESIME_URL=${CARNET_MILLESIME_URL:-http://millesime:8098}   # adresse de Millésime dans la stack
      - CARNET_LINKEDIN_CLIENT_ID=${CARNET_LINKEDIN_CLIENT_ID:-}
      - CARNET_LINKEDIN_CLIENT_SECRET=${CARNET_LINKEDIN_CLIENT_SECRET:-}
      - CARNET_TELEGRAM_API_ID=${CARNET_TELEGRAM_API_ID:-}      # import ponctuel des contacts Telegram
      - CARNET_TELEGRAM_API_HASH=${CARNET_TELEGRAM_API_HASH:-}
      - KIT_URL=http://kit-urgence:8095
      - LOG_LEVEL=INFO
    volumes:
      # Fichiers déposés à la main (dossier visible depuis le PC)
      - ${CARNET_DATA_DIR}:/data
      # Base carnet2.db, sauvegardes d'iCloud et ancienne base 1.3 : hors de tout partage et de OneDrive
      - ${CARNET_STATE_DIR}:/state
      # Dossier config/ du kit d'urgence : carnet y écrit contacts-urgence.vcf
      - ${KIT_DATA_DIR}/config:/kit-config
